<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitoring Beban</title>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #38bdf8;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .input-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .start {
            background: #22c55e;
            color: white;
        }

        .pause {
            background: #f59e0b;
            color: white;
        }

        .reset {
            background: #ef4444;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .timer {
            font-size: 60px;
            text-align: center;
            margin-top: 25px;
            color: #38bdf8;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            background: #334155;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

            .box h2 {
                color: #94a3b8;
                margin-bottom: 10px;
            }

            .box p {
                font-size: 30px;
                color: #38bdf8;
                font-weight: bold;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #475569;
        }

        th {
            background: #334155;
        }

        tr:hover {
            background: #273449;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>MONITORING BEBAN</h1>

        <!-- CONTROL -->
        <div class="card">

            <div class="input-group">

                <input type="text"
                       id="namaBeban"
                       placeholder="Masukkan Nama Beban">

            </div>

            <div class="button-group">

                <button id="btnStart"
                        class="start disabled"
                        disabled>
                    MULAI
                </button>

                <button id="btnPause"
                        class="pause">
                    PAUSE
                </button>

                <button id="btnReset"
                        class="reset">
                    RESET
                </button>

            </div>

            <div class="status">

                Status :
                <span id="statusMonitoring">
                    IDLE
                </span>

            </div>

            <div class="timer" id="timer">
                10:00
            </div>

        </div>

        <!-- PARAMETER -->
        <div class="card">

            <div class="grid">

                <div class="box">
                    <h2>Tegangan</h2>
                    <p id="tegangan">0 V</p>
                </div>

                <div class="box">
                    <h2>Arus</h2>
                    <p id="arus">0 A</p>
                </div>

                <div class="box">
                    <h2>Daya</h2>
                    <p id="daya">0 W</p>
                </div>

                <div class="box">
                    <h2>Energi</h2>
                    <p id="energi">0 kWh</p>
                </div>

            </div>

        </div>
        <!-- HISTORY -->
        <div class="card">

            <h2 style="margin-bottom:20px;">
                History Pengambilan Data
            </h2>

            <div id="summaryContainer"></div>

            <div id="detailContainer"></div>

        </div>

    </div>

    <script>

        // ======================================================
        // FIREBASE CONFIG
        // ======================================================

        const firebaseConfig = {

            apiKey: "AIzaSyBYcdUh9r5VGvJdgtKfn0oNKFWWzVTeCho",

            authDomain: "fir-c36b5.firebaseapp.com",

            databaseURL:
                "https://fir-c36b5-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId: "fir-c36b5",

            storageBucket:
                "fir-c36b5.firebasestorage.app",

            messagingSenderId:
                "173706592466",

            appId:
                "1:173706592466:web:734aa2fcd777f4fa532d0b"

        };

        firebase.initializeApp(firebaseConfig);

        const db = firebase.database();

        // ======================================================
        // ELEMENT
        // ======================================================

        const btnStart =
            document.getElementById("btnStart");

        const btnPause =
            document.getElementById("btnPause");

        const btnReset =
            document.getElementById("btnReset");

        const namaBeban =
            document.getElementById("namaBeban");

        const statusMonitoring =
            document.getElementById("statusMonitoring");

        const timerElement =
            document.getElementById("timer");

        const tegangan =
            document.getElementById("tegangan");

        const arus =
            document.getElementById("arus");

        const daya =
            document.getElementById("daya");

        const energi =
            document.getElementById("energi");

        const summaryContainer =
            document.getElementById("summaryContainer");

        const detailContainer =
            document.getElementById("detailContainer");

        // ======================================================
        // TIMER
        // ======================================================

        let totalSeconds = 600;

        let timerInterval = null;

        let historyInterval = null;

        let running = false;

        let minuteCounter = 0;

        let startTime = null;
        updateTimer();

        // ======================================================
        // ENABLE BUTTON
        // ======================================================

        namaBeban.addEventListener("input", () => {

            if (namaBeban.value.trim() !== "") {

                btnStart.disabled = false;

                btnStart.classList.remove("disabled");

            }

            else {

                btnStart.disabled = true;

                btnStart.classList.add("disabled");

            }

        });

        // ======================================================
        // START
        // ======================================================

        btnStart.addEventListener("click", () => {

            // ==========================================
            // CEK NAMA BEBAN
            // ==========================================

            if (namaBeban.value.trim() === "") {

                alert("Masukkan nama beban");

                return;

            }

            // ==========================================
            // JIKA TIMER SUDAH HABIS
            // MAKA BUAT SESI BARU
            // ==========================================

            if (totalSeconds <= 0) {

                running = false;

                clearInterval(timerInterval);

                clearInterval(historyInterval);

                db.ref("monitoring/status")
                    .set("SELESAI");

                db.ref("monitoring/relay")
                    .set("OFF");

                alert(
                    "Pengambilan data " +
                    namaBeban.value +
                    " selesai"
                );

            }

            // ==========================================
            // JALANKAN TIMER
            // ==========================================

            if (!running) {
                minuteCounter = 0;

                totalSeconds = 600;

                updateTimer();

                startTime = Date.now();

                running = true;

                db.ref("monitoring/status")
                    .set("BERJALAN");

                db.ref("monitoring/relay")
                    .set("ON");

                db.ref("monitoring/namaBeban")
                    .set(namaBeban.value);

                startTimer();

                startHistorySave();


            }

        });

        // ======================================================
        // PAUSE
        // ======================================================

        btnPause.addEventListener("click", () => {

            running = false;

            clearInterval(timerInterval);

            clearInterval(historyInterval);

            db.ref("monitoring/status")
                .set("PAUSE");

            db.ref("monitoring/relay")
                .set("OFF");

        });

        // ======================================================
        // RESET
        // ======================================================

        btnReset.addEventListener("click", () => {

            running = false;

            clearInterval(timerInterval);

            clearInterval(historyInterval);

            totalSeconds = 600;

            minuteCounter = 0;

            updateTimer();

            db.ref("monitoring/status")
                .set("RESET");

            db.ref("monitoring/relay")
                .set("OFF");

        });

        // ======================================================
        // TIMER
        // ======================================================

        function startTimer() {

            clearInterval(timerInterval);

            timerInterval = setInterval(() => {

                if (!running) return;

                // ==========================================
                // HITUNG WAKTU BERDASARKAN JAM ASLI
                // ==========================================

                const elapsedSeconds =
                    Math.floor(
                        (Date.now() - startTime) / 1000
                    );

                totalSeconds =
                    600 - elapsedSeconds;

                // ==========================================
                // BATAS MINIMUM
                // ==========================================

                if (totalSeconds < 0) {

                    totalSeconds = 0;

                }

                updateTimer();

            }, 1000);

        }

        // ======================================================
        // SAVE HISTORY EVERY 1 MINUTE
        // ======================================================

        function startHistorySave() {

            clearInterval(historyInterval);

            historyInterval = setInterval(() => {

                // ==========================================
                // CEK TIMER MASIH JALAN
                // ==========================================

                if (!running) return;

                // ==========================================
                // TAMBAH MENIT
                // ==========================================

                minuteCounter =
                    Math.floor(
                        (Date.now() - startTime)
                        / 60000
                    );
                if (minuteCounter < 1) return;

                // ==========================================
                // AMBIL DATA REALTIME
                // ==========================================

                db.ref("Realtime")
                    .once("value", (snapshot) => {

                        if (snapshot.exists()) {

                            const data = snapshot.val();

                            const historyData = {

                                namaBeban:
                                    namaBeban.value,

                                menit:
                                    minuteCounter,

                                tegangan:
                                    data.tegangan || 0,

                                arus:
                                    data.arus || 0,

                                daya:
                                    data.daya || 0,

                                energi:
                                    data.energi || 0,

                                waktu:
                                    new Date().toLocaleString()

                            };

                            // ==========================================
                            // SIMPAN FIREBASE
                            // ==========================================

                            db.ref(
                                "History/" +
                                namaBeban.value +
                                "/menit_" +
                                minuteCounter
                            ).set(historyData);

                            // ==========================================
                            // JIKA SUDAH MENIT 10
                            // ==========================================

                            if (minuteCounter >= 10) {

                                running = false;

                                clearInterval(timerInterval);

                                clearInterval(historyInterval);

                                db.ref("monitoring/status")
                                    .set("SELESAI");

                                db.ref("monitoring/relay")
                                    .set("OFF");

                                alert(
                                    "Pengambilan data selesai"
                                );

                            }

                        }

                    });

            }, 60000);

        }

        // ======================================================
        // UPDATE TIMER
        // ======================================================

        function updateTimer() {

            let minutes =
                Math.floor(totalSeconds / 60);

            let seconds =
                totalSeconds % 60;

            if (seconds < 10) {

                seconds = "0" + seconds;

            }

            timerElement.innerHTML =
                minutes + ":" + seconds;

        }

        // ======================================================
        // STATUS REALTIME
        // ======================================================

        db.ref("monitoring/status")
            .on("value", (snapshot) => {

                if (snapshot.exists()) {

                    statusMonitoring.innerHTML =
                        snapshot.val();

                }

            });

        // ======================================================
        // REALTIME PZEM
        // ======================================================

        db.ref("Realtime")
            .on("value", (snapshot) => {

                if (snapshot.exists()) {

                    const data = snapshot.val();

                    tegangan.innerHTML =
                        parseFloat(
                            data.tegangan || 0
                        ).toFixed(1) + " V";

                    arus.innerHTML =
                        parseFloat(
                            data.arus || 0
                        ).toFixed(2) + " A";

                    daya.innerHTML =
                        parseFloat(
                            data.daya || 0
                        ).toFixed(1) + " W";

                    energi.innerHTML =
                        parseFloat(
                            data.energi || 0
                        ).toFixed(3) + " kWh";

                }

            });

        // ======================================================
        // HISTORY TABLE
        // ======================================================

        db.ref("History")
            .on("value", (snapshot) => {

                summaryContainer.innerHTML = "";

                if (snapshot.exists()) {

                    const allData = snapshot.val();

                    let summaryHTML = `

        <table>

            <thead>

                <tr>

                    <th>Nama Beban</th>
                    <th>Avg Tegangan</th>
                    <th>Avg Arus</th>
                    <th>Avg Daya</th>
                    <th>Avg Energi</th>

                </tr>

            </thead>

            <tbody>

        `;

                    for (let beban in allData) {

                        const sortedMenit =
                            Object.keys(allData[beban])
                                .sort((a, b) => {

                                    return parseInt(a.split("_")[1]) -
                                        parseInt(b.split("_")[1]);

                                });

                        let totalTegangan = 0;
                        let totalArus = 0;
                        let totalDaya = 0;
                        let totalEnergi = 0;

                        let jumlahData =
                            sortedMenit.length;

                        sortedMenit.forEach((menit) => {

                            const data =
                                allData[beban][menit];

                            totalTegangan +=
                                parseFloat(data.tegangan || 0);

                            totalArus +=
                                parseFloat(data.arus || 0);

                            totalDaya +=
                                parseFloat(data.daya || 0);

                            totalEnergi +=
                                parseFloat(data.energi || 0);

                        });

                        let avgTegangan =
                            (totalTegangan / jumlahData)
                                .toFixed(1);

                        let avgArus =
                            (totalArus / jumlahData)
                                .toFixed(2);

                        let avgDaya =
                            (totalDaya / jumlahData)
                                .toFixed(1);

                        let avgEnergi =
                            (totalEnergi / jumlahData)
                                .toFixed(3);

                        summaryHTML += `

            <tr
                onclick="showDetail('${beban}')"
                style="cursor:pointer;"
            >

                <td><b>${beban}</b></td>

                <td>${avgTegangan} V</td>

                <td>${avgArus} A</td>

                <td>${avgDaya} W</td>

                <td>${avgEnergi} kWh</td>

            </tr>

            `;

                    }

                    summaryHTML += `
            </tbody>
        </table>
        `;

                    summaryContainer.innerHTML =
                        summaryHTML;

                    // ==========================================
                    // SIMPAN GLOBAL
                    // ==========================================

                    window.historyFirebase =
                        allData;

                }

            });
        function showDetail(beban) {

            const allData =
                window.historyFirebase;

            const dataBeban =
                allData[beban];

            const sortedMenit =
                Object.keys(dataBeban)
                    .sort((a, b) => {

                        return parseInt(a.split("_")[1]) -
                            parseInt(b.split("_")[1]);

                    });

            // ==========================================
            // HIDE SUMMARY
            // ==========================================

            summaryContainer.style.display =
                "none";

            // ==========================================
            // DETAIL HTML
            // ==========================================

            let detailHTML = `

    <button
        onclick="backToSummary()"
        class="pause"
        style="margin-bottom:20px;"
    >
        KEMBALI
    </button>

    <div class="card">

        <h2 style="margin-bottom:20px;">
            Detail ${beban}
        </h2>

        <table>

            <thead>

                <tr>

                    <th>Menit</th>
                    <th>Tegangan</th>
                    <th>Arus</th>
                    <th>Daya</th>
                    <th>Energi</th>
                    <th>Waktu</th>

                </tr>

            </thead>

            <tbody>

    `;

            sortedMenit.forEach((menit) => {

                const data =
                    dataBeban[menit];

                detailHTML += `

        <tr>

            <td>${data.menit}</td>

            <td>${data.tegangan} V</td>

            <td>${data.arus} A</td>

            <td>${data.daya} W</td>

            <td>${data.energi} kWh</td>

            <td>${data.waktu}</td>

        </tr>

        `;

            });

            detailHTML += `

            </tbody>

        </table>

    </div>

    `;

            detailContainer.innerHTML =
                detailHTML;

        }
        function backToSummary() {

            detailContainer.innerHTML = "";

            summaryContainer.style.display =
                "block";

        }

    </script>

</body>
</html>
